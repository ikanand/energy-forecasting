[project]
name = "energy-forecasting"
description = "Day-ahead hourly electricity demand forecasting on Databricks (end-to-end MLOps demo)"
requires-python = ">=3.12, <3.13"
dynamic = ["version"]
dependencies = [
    "mlflow>=3.1,<4",
    "databricks-feature-engineering>=0.12",
    "databricks-sdk>=0.55",
    "lightgbm>=4.6,<5",
    "optuna>=4.0,<5",
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "holidays>=0.60",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pre-commit>=4.1",
]
test = [
    "pre-commit>=4.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["energy_forecasting*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ci_exclude: needs a Databricks workspace; skipped in CI"]
addopts = ["--cov=src", "--cov-report=term"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM"]
