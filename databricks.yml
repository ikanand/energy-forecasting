bundle:
  name: energy-forecasting

include:
  - resources/*.yml

# The package in src/ is built into a wheel and installed on serverless compute,
# so every environment runs exactly the same versioned code (deploy-code pattern).
artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

variables:
  git_sha:
    description: Commit being deployed (set by CI/CD)
    default: local
  branch:
    description: Branch being deployed (set by CI/CD)
    default: local
  schedule_pause_status:
    description: PAUSED everywhere except prod, so dev/uat never burn credits on a cron
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://REPLACE-ME.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  uat:
    mode: production
    workspace:
      host: https://REPLACE-ME.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://REPLACE-ME.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: PAUSED   # switch to UNPAUSED once the demo pipeline is proven

# One trial workspace -> all three targets use the same host. Environments are
# separated by Unity Catalog catalog (mlops_dev / mlops_uat / mlops_prod), chosen
# in project_config.yml from --env ${bundle.target}.
